<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 每日巡检留证中心</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --primary: #2563eb; --primary-d: #1d4ed8; --accent: #38bdf8;
      --line: #e6ebf2; --text: #0f172a; --sub: #64748b; --muted: #94a3b8;
      --bad: #dc2626; --ink-900: #0b1220; --ink-800: #131f35;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font-sans);
      color: var(--text);
      background: radial-gradient(1200px 600px at 15% 10%, #1e3a8a 0%, transparent 55%),
                  radial-gradient(1000px 600px at 85% 90%, #0e7490 0%, transparent 55%),
                  linear-gradient(135deg, var(--ink-900), var(--ink-800));
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: 100%; max-width: 420px;
      background: #ffffff; border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0,0,0,.35);
      overflow: hidden;
    }
    .login-head {
      padding: 30px 32px 24px;
      color: #fff;
      background: linear-gradient(135deg, #1d4ed8, #2563eb 55%, #0e7490);
      position: relative;
    }
    .login-head .logo { font-size: 34px; display: block; margin-bottom: 10px; }
    /* SVG 图标基础规则: 描边跟随文字色, 未定义会以黑色实心填充 */
    .ico {
      width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em;
      fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .login-head .logo .ico { width: 34px; height: 34px; color: #fff; stroke-width: 1.7; }
    .login-head h1 { font-size: 20px; margin: 0 0 6px; font-weight: 700; letter-spacing: .3px; }
    .login-head p { margin: 0; font-size: 13px; color: rgba(255,255,255,.82); }
    .login-body { padding: 28px 32px 32px; }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: var(--sub); margin-bottom: 7px; }
    .field input {
      width: 100%; padding: 12px 14px; font-size: 15px;
      border: 1px solid var(--line); border-radius: 10px; outline: none;
      transition: border-color .15s, box-shadow .15s;
      font-family: inherit;
    }
    .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.13); }
    .btn-login {
      width: 100%; padding: 13px; margin-top: 6px;
      font-size: 16px; font-weight: 650; color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-d));
      border: none; border-radius: 10px; cursor: pointer;
      transition: filter .15s, transform .1s;
    }
    .btn-login:hover { filter: brightness(1.07); }
    .btn-login:active { transform: translateY(1px); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }
    .msg { min-height: 20px; margin-top: 14px; font-size: 13px; text-align: center; color: var(--bad); }
    .hint { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.5); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-head">
      <span class="logo"><svg class="ico logo-ico" aria-hidden="true"><use href="icons.svg#monitor" xlink:href="icons.svg#monitor"></use></svg></span>
      <h1>每日巡检留证中心</h1>
      <p>管理员登录 · 仅限授权访问</p>
    </div>
    <div class="login-body">
      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="username">用户名</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="管理员用户名" required />
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="登录密码" required />
        </div>
        <button id="btnLogin" class="btn-login" type="submit">登 录</button>
      </form>
      <div id="msg" class="msg"></div>
      <div class="hint">仅限授权管理员访问<br />连续 5 次登录失败将锁定 1 分钟</div>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
